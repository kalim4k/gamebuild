<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio du live</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23ff453a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/live/live.css">
<style>
/* ══════════════════════════════════════════════════════════
   GAME BUILD — l'espace de l'animateur du live
   Pensé d'abord pour le téléphone : la slide en haut, deux gros
   boutons pour avancer, les slides suivantes en vignettes, et une
   barre d'actions en bas (micro, offre, chat, live). Le chat s'ouvre
   en feuille par-dessus. Sur ordinateur, le chat reste à droite.

   Deux façons d'entrer :
   - « Entrer » avec le mot de passe : connecté à LiveKit, prêt à lancer ;
   - « Répéter » : les slides et les notes seulement, rien n'est diffusé.

   L'état du live est porté par les attributs de l'animateur dans
   LiveKit (etat, slide, offre, question, chat).
   Sur ordinateur : flèches ou espace pour les slides, M micro, O offre.
   ══════════════════════════════════════════════════════════ */
html, body{ min-height: 100%; }
body{ min-height: 100dvh; }

/* ── Connexion ── */
.connexion{ min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; }
.carte{ width: 100%; max-width: 380px; display: grid; gap: 16px; }
.carte h1{ margin: 0 0 4px; font-size: 30px; letter-spacing: -.02em; }
.carte .btn{ width: 100%; }
.carte .ou{ text-align: center; color: var(--ink-3); font-size: 14px; }

/* ── Barre du haut ── */
.haut{ position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(0,0,0,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.haut .infos{ display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.haut .quitter{ font-size: 14px; }

/* ── Le studio ── */
.studio{ padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.principal{ display: flex; flex-direction: column; gap: 14px; padding: 0 0 8px; }
.cadre{ position: relative; }
.cadre .scene{ touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer; }
.cadre .indice{ position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: rgba(255,255,255,.45); pointer-events: none; }

.nav{ display: grid; grid-template-columns: 1fr auto 1.6fr; gap: 10px; align-items: center; padding: 0 16px; }
.nav .btn{ min-height: 56px; font-size: 17px; border-radius: 16px; }
.nav .num{ min-width: 64px; text-align: center; color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }

.notes{ margin: 0 16px; padding: 14px 16px; background: var(--bg-2); border-radius: 14px; font-size: 17px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
.notes:empty{ display: none; }

.question{ margin: 0 16px; border-radius: 12px; }
.question span{ flex: 1; }

/* Les vignettes : toutes les slides, la suivante en premier plan */
.vignettes{ display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 6px; scroll-snap-type: x proximity; scroll-padding: 0 16px; scrollbar-width: none; }
.vignettes::-webkit-scrollbar{ display: none; }
.vignette{ flex: none; width: 132px; display: grid; gap: 6px; padding: 0; background: none; border: 0; cursor: pointer; scroll-snap-align: start; text-align: left; }
.vignette .scene{ border-radius: 8px; outline: 2px solid transparent; outline-offset: 2px; pointer-events: none; }
.vignette .slide{ animation: none; }
.vignette span{ font-size: 12px; color: var(--ink-3); }
.vignette.courante .scene{ outline-color: var(--blue); }
.vignette.courante span{ color: var(--blue); font-weight: 600; }
.vignette.passee{ opacity: .45; }

/* ── La barre d'actions ── */
.actions{ position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(17,17,19,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--hair); }
.action{ position: relative; display: grid; justify-items: center; gap: 4px; min-height: 60px; padding: 8px 4px; border: 0; border-radius: 14px; background: none; color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; }
.action svg{ width: 26px; height: 26px; }
.action:disabled{ opacity: .3; cursor: default; }
.action.on{ color: var(--green); }
.action.off-direct{ color: var(--red); }
.action.offre-on{ color: var(--blue); }
.action.live{ background: var(--red); color: #fff; }
.action.live.fin{ background: var(--bg-3); color: var(--red); }
.badge{ position: absolute; top: 4px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--blue-bg); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.badge:empty{ display: none; }

/* ── Le chat en feuille ── */
.feuille{ position: fixed; inset: 18% 0 0 0; z-index: 8; display: flex; flex-direction: column; border-radius: 18px 18px 0 0; overflow: hidden; background: var(--bg-2); box-shadow: 0 -10px 40px rgba(0,0,0,.6); transform: translateY(100%); transition: transform .3s cubic-bezier(.28,.11,.32,1); visibility: hidden; }
.feuille.ouverte{ transform: none; visibility: visible; }
.voile{ position: fixed; inset: 0; z-index: 7; background: rgba(0,0,0,.5); }
.feuille .chat{ flex: 1; }
.feuille .chat-tete button{ min-height: 36px; padding: 6px 14px; font-size: 14px; }
.msg{ cursor: pointer; border-radius: 10px; padding: 4px 6px; margin: 0 -6px; }
.msg:active{ background: var(--bg-3); }

/* ── Le menu d'un message ── */
.menu{ position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
.menu .apercu{ background: var(--bg-3); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
.menu .apercu b{ color: var(--ink-2); margin-right: 6px; }
.menu .groupe{ display: grid; background: var(--bg-3); border-radius: 14px; overflow: hidden; }
.menu .groupe button{ min-height: 54px; border: 0; border-top: 1px solid var(--hair); background: none; color: var(--blue); font-size: 17px; cursor: pointer; }
.menu .groupe button:first-child{ border-top: 0; }
.menu .groupe button.danger{ color: var(--red); }
.menu .annuler{ min-height: 54px; border: 0; border-radius: 14px; background: var(--bg-3); color: var(--ink); font-weight: 600; font-size: 17px; cursor: pointer; }

.toast{ position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 9; padding: 12px 16px; border-radius: 14px; background: var(--bg-3); color: var(--ink); font-size: 15px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.toast.erreur{ color: var(--red); }

/* ── Ordinateur : le chat reste à droite ── */
@media (min-width: 1000px){
  .studio{ display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 24px; padding: 0 24px calc(100px + env(safe-area-inset-bottom)); }
  .haut{ grid-column: 1 / -1; padding-left: 0; padding-right: 0; }
  .principal{ padding-top: 8px; }
  .cadre .scene{ border-radius: 16px; }
  .nav, .vignettes{ padding-left: 0; padding-right: 0; }
  .notes, .question{ margin-left: 0; margin-right: 0; }
  .feuille{ position: sticky; top: 64px; inset: auto; height: calc(100dvh - 180px); transform: none; visibility: visible; border-radius: 16px; box-shadow: none; transition: none; }
  .voile, .feuille .fermer, #bouton-chat{ display: none !important; }
  .actions{ left: 24px; right: 428px; bottom: 16px; border-radius: 18px; border: 1px solid var(--hair); grid-template-columns: repeat(3, 1fr); }
  .toast{ left: auto; right: 428px; width: 420px; }
}
</style>
</head>
<body>

<!-- 1. Connexion -->
<section class="connexion" id="connexion">
  <form class="carte" id="form-connexion">
    <h1>Studio du live</h1>
    <label class="champ"><span>Ton nom dans le chat</span><input id="nom" maxlength="24" autocomplete="name"></label>
    <label class="champ"><span>Mot de passe</span><input id="mdp" type="password" autocomplete="current-password" required></label>
    <p class="erreur" id="erreur" role="alert"></p>
    <button class="btn btn-lg" type="submit" id="entrer">Entrer dans le studio</button>
    <div class="ou">ou</div>
    <button class="btn btn-lg btn-gris" type="button" id="repeter">Répéter mes slides</button>
    <p style="margin:0;color:var(--ink-3);font-size:13px;text-align:center">En entrant, tu n'es pas encore en direct : personne ne t'entend avant « Lancer ».</p>
  </form>
</section>

<!-- 2. Le studio -->
<div class="studio" id="studio" hidden>
  <header class="haut">
    <div class="infos">
      <span class="pastille" id="pastille">Prêt</span>
      <span id="chrono" hidden>00:00</span>
      <span id="compte"></span>
    </div>
    <button class="lien quitter" type="button" id="quitter">Quitter</button>
  </header>

  <main class="principal">
    <div class="cadre">
      <div class="scene" id="scene" role="button" aria-label="Touche à droite pour la slide suivante, à gauche pour la précédente"></div>
      <span class="indice" id="indice">Touche pour avancer</span>
    </div>
    <div class="question" id="question" hidden><small>En avant</small><span id="question-texte"></span><button class="lien" type="button" id="retirer-question">Retirer</button></div>
    <div class="nav">
      <button class="btn btn-gris" type="button" id="prec" aria-label="Slide précédente">Précédente</button>
      <span class="num" id="num"></span>
      <button class="btn" type="button" id="suiv">Suivante</button>
    </div>
    <div class="notes" id="notes"></div>
    <div class="vignettes" id="vignettes" aria-label="Toutes les slides"></div>
  </main>

  <div class="voile" id="voile" hidden></div>
  <aside class="feuille" id="feuille" aria-label="Chat du live">
    <section class="chat">
      <div class="chat-tete">
        <span>Chat</span>
        <span style="display:flex;gap:8px">
          <button class="btn btn-gris" type="button" id="chat-bascule">Fermer le chat</button>
          <button class="btn btn-gris fermer" type="button" id="fermer-feuille">OK</button>
        </span>
      </div>
      <div class="chat-liste" id="liste"><div class="msg-sys" id="chat-vide">Les questions arriveront ici. Touche un message pour le modérer.</div></div>
      <form class="chat-form" id="form-chat" autocomplete="off">
        <input id="message" maxlength="200" placeholder="Écrire à tout le monde" aria-label="Ton message">
        <button class="btn" type="submit">Envoyer</button>
      </form>
    </section>
  </aside>

  <nav class="actions" aria-label="Commandes du live">
    <button class="action" type="button" id="micro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path id="micro-barre" d="M4 4l16 16"/></svg>
      <span id="micro-t">Micro coupé</span>
    </button>
    <button class="action" type="button" id="offre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>
      <span id="offre-t">Offre</span>
    </button>
    <button class="action" type="button" id="bouton-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span>Chat</span><i class="badge" id="badge"></i>
    </button>
    <button class="action live" type="button" id="live">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
      <span id="live-t">Lancer</span>
    </button>
  </nav>

  <div id="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
<script src="/live/commun.js"></script>
<script src="/live/slides.js"></script>
<script>
(function () {
  "use strict";
  var C = window.LiveCommun, CONF = window.LIVE || { slides: [] };
  var SLIDES = CONF.slides || [];
  var $ = function (id) { return document.getElementById(id); };

  var mode = null;               /* "repetition" ou "studio" */
  var room = null, motDePasse = "", monNom = "", index = 0;
  var etat = { etat: "attente", slide: "0", offre: "", question: "", chat: "" };
  var historique = [];           /* les derniers messages visibles, envoyés aux retardataires */
  var nonLus = 0, debut = null, minuteur = null, verrouEcran = null, toastMinuteur = null;
  var enreg = null;              /* l'enregistrement en cours : { recorder, morceaux, t0, date, type, evenements } */

  try { $("nom").value = localStorage.getItem("live-studio-nom") || CONF.animateur || ""; } catch (e) {}

  function toast(t, estErreur) {
    clearTimeout(toastMinuteur);
    $("toast").textContent = t;
    $("toast").classList.toggle("erreur", !!estErreur);
    $("toast").hidden = false;
    toastMinuteur = setTimeout(function () { $("toast").hidden = true; }, estErreur ? 6000 : 3500);
  }

  /* ── Entrer ── */
  $("repeter").addEventListener("click", function () { entre("repetition"); });

  $("form-connexion").addEventListener("submit", function (ev) {
    ev.preventDefault();
    $("erreur").textContent = "";
    $("entrer").disabled = true;
    motDePasse = $("mdp").value;
    monNom = $("nom").value.trim() || CONF.animateur || "Animateur";
    try { localStorage.setItem("live-studio-nom", monNom); } catch (e) {}
    var LK = window.LivekitClient;
    fetch("/api/live", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "jeton", role: "animateur", motDePasse: motDePasse, nom: monNom }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { code: r.status, ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (x.code === 503) throw new Error("Le live n'est pas encore branché : les clés LiveKit ne sont pas actives sur le site. Vérifie les 4 variables dans Vercel, puis relance un déploiement (Redeploy). En attendant, tu peux répéter tes slides.");
        if (!x.ok) throw new Error(x.j && x.j.erreur || "Connexion impossible.");
        if (!LK) throw new Error("Le module du live n'a pas chargé. Vérifie ta connexion et recharge la page.");
        room = new LK.Room({
          publishDefaults: { audioPreset: LK.AudioPresets.speech, dtx: true, red: true },
          audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        branche(room, LK.RoomEvent);
        return room.connect(x.j.url, x.j.jeton);
      })
      .then(function () {
        /* On reprend l'état si on revient après une coupure. */
        var a = room.localParticipant.attributes || {};
        if (a.etat) Object.keys(a).forEach(function (k) { etat[k] = a[k]; });
        if (etat.etat === "fin") etat.etat = "attente";
        index = Math.max(0, Math.min(SLIDES.length - 1, parseInt(etat.slide, 10) || 0));
        publie({ etat: etat.etat, slide: String(index) });
        if (etat.etat === "direct") { debut = Date.now(); minuteur = setInterval(chrono, 1000); }
        entre("studio");
      })
      .catch(function (e) {
        if (room) { room.disconnect(); room = null; }
        $("erreur").textContent = (e && e.message) || "Connexion impossible.";
        $("entrer").disabled = false;
      });
  });

  function entre(m) {
    mode = m;
    $("connexion").hidden = true;
    $("studio").hidden = false;
    construitVignettes();
    affiche();
    if (m === "repetition") toast("Mode répétition : rien n'est diffusé.");
  }

  $("quitter").addEventListener("click", function () {
    if (etat.etat === "direct" && !confirm("Tu es en direct. Quitter coupe ta voix pour tout le monde. Quitter quand même ?")) return;
    location.reload();
  });

  function publie(changes) {
    Object.keys(changes).forEach(function (k) { etat[k] = changes[k]; });
    if (!room) return Promise.resolve();
    return room.localParticipant.setAttributes(changes).catch(function () { toast("L'état n'a pas été envoyé. Vérifie ta connexion.", true); });
  }

  function branche(r, E) {
    r.on(E.ParticipantConnected, function (p) {
      compte();
      /* Le retardataire reçoit les derniers messages du chat. */
      if (historique.length) r.localParticipant.publishData(C.encode({ messages: historique }), { reliable: true, topic: "historique", destinationIdentities: [p.identity] }).catch(function () {});
    });
    r.on(E.ParticipantDisconnected, compte);
    r.on(E.DataReceived, function (donnees, p, kind, topic) {
      if (topic !== "chat" || !p) return;
      var o = C.decode(donnees);
      var t = o && C.texteChat(o.texte);
      if (!t) return;
      ajouteMessage({ id: String(o.id || C.idMessage()).replace(/[^a-z0-9]/gi, "").slice(0, 20), nom: p.name || "Anonyme", texte: t, de: p.identity, anim: false });
    });
    [E.LocalTrackPublished, E.LocalTrackUnpublished, E.TrackMuted, E.TrackUnmuted].forEach(function (ev) { r.on(ev, majActions); });
    r.on(E.Reconnecting, function () { toast("Connexion instable, je me reconnecte…", true); });
    r.on(E.Reconnected, function () { toast("Reconnecté."); });
    r.on(E.Disconnected, function () {
      $("pastille").textContent = "Déconnecté";
      $("pastille").classList.remove("direct");
      if (etat.etat !== "fin") toast("Tu as été déconnecté. Touche « Quitter », puis reconnecte-toi : le live reprendra là où il en était.", true);
    });
  }

  function compte() {
    if (!room) { $("compte").textContent = ""; return; }
    var n = room.remoteParticipants.size;
    $("compte").textContent = n + (n > 1 ? " spectateurs" : " spectateur");
  }

  /* ── Les slides ── */
  function construitVignettes() {
    var v = $("vignettes");
    v.textContent = "";
    SLIDES.forEach(function (s, i) {
      var b = C.el("button", "vignette");
      b.type = "button";
      var sc = C.el("div", "scene mini");
      C.rendSlide(sc, SLIDES, i);
      b.appendChild(sc);
      b.appendChild(C.el("span", null, (i + 1) + ". " + (s.surtitre || s.titre || s.grand || "Slide")));
      b.addEventListener("click", function () { va(i); });
      v.appendChild(b);
    });
  }

  function affiche() {
    C.rendSlide($("scene"), SLIDES, index);
    $("num").textContent = (index + 1) + " / " + SLIDES.length;
    $("notes").textContent = (SLIDES[index] || {}).notes || "";
    $("prec").disabled = index <= 0;
    $("suiv").disabled = index >= SLIDES.length - 1;
    $("suiv").textContent = index >= SLIDES.length - 1 ? "Dernière slide" : "Suivante";
    $("indice").hidden = index > 0;
    Array.prototype.forEach.call($("vignettes").children, function (b, i) {
      b.classList.toggle("courante", i === index);
      b.classList.toggle("passee", i < index);
    });
    var v = $("vignettes"), cour = v.children[index];
    if (cour) v.scrollTo({ left: Math.max(0, v.scrollLeft + cour.getBoundingClientRect().left - v.getBoundingClientRect().left - 16), behavior: "smooth" });
    majActions();
  }

  function va(i) {
    if (i < 0 || i >= SLIDES.length || i === index) return;
    index = i;
    var changes = { slide: String(i) };
    /* Une slide marquée « offre » affiche le bouton chez tout le monde. */
    if (SLIDES[i].offre && etat.offre !== "1") changes.offre = "1";
    publie(changes);
    note(changes.offre ? { slide: i, offre: true } : { slide: i });
    affiche();
  }
  $("prec").addEventListener("click", function () { va(index - 1); });
  $("suiv").addEventListener("click", function () { va(index + 1); });

  /* Toucher la slide : à droite on avance, à gauche on recule. Glisser marche aussi. */
  var depart = null;
  $("scene").addEventListener("pointerdown", function (ev) { depart = { x: ev.clientX, y: ev.clientY }; });
  $("scene").addEventListener("pointercancel", function () { depart = null; });
  $("scene").addEventListener("pointerup", function (ev) {
    if (!depart) return;
    var dx = ev.clientX - depart.x, dy = ev.clientY - depart.y;
    depart = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { va(index + (dx < 0 ? 1 : -1)); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      var r = $("scene").getBoundingClientRect();
      va(index + (ev.clientX - r.left < r.width / 3 ? -1 : 1));
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (!mode || /input|textarea/i.test(document.activeElement && document.activeElement.tagName)) return;
    if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " ") { ev.preventDefault(); va(index + 1); }
    else if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); va(index - 1); }
    else if (ev.key === "m" || ev.key === "M") { basculeMicro(); }
    else if (ev.key === "o" || ev.key === "O") { $("offre").click(); }
  });

  /* ── La barre d'actions ── */
  function microActif() { return !!(room && room.localParticipant.isMicrophoneEnabled); }
  function majActions() {
    var connecte = !!room, direct = etat.etat === "direct", on = microActif();
    $("micro").disabled = !connecte;
    $("micro").classList.toggle("on", on);
    $("micro").classList.toggle("off-direct", !on && direct);
    $("micro-barre").style.display = on ? "none" : "";
    $("micro-t").textContent = on ? "Micro ouvert" : "Micro coupé";

    $("offre").disabled = !connecte;
    $("offre").classList.toggle("offre-on", etat.offre === "1");
    $("offre-t").textContent = etat.offre === "1" ? "Offre affichée" : "Offre";

    $("bouton-chat").disabled = !connecte;
    $("badge").textContent = nonLus ? String(nonLus) : "";
    $("chat-bascule").textContent = etat.chat === "ferme" ? "Ouvrir le chat" : "Fermer le chat";

    $("live").disabled = !connecte || etat.etat === "fin";
    $("live").classList.toggle("fin", direct);
    $("live-t").textContent = direct ? "Terminer" : (etat.etat === "fin" ? "Terminé" : "Lancer");

    $("pastille").textContent = mode === "repetition" ? "Répétition" : direct ? "En direct" : (etat.etat === "fin" ? "Terminé" : "Prêt");
    $("pastille").classList.toggle("direct", direct);
    $("chrono").hidden = !direct;
    compte();
  }

  function basculeMicro() {
    if (!room) return Promise.resolve();
    return room.localParticipant.setMicrophoneEnabled(!microActif())
      .then(function () { majActions(); if (etat.etat === "direct" && microActif()) demarreEnregistrement(); })
      .catch(function () { toast("Le micro est refusé. Autorise-le pour ce site dans les réglages du navigateur, puis réessaie.", true); });
  }
  $("micro").addEventListener("click", basculeMicro);

  $("live").addEventListener("click", function () {
    if (!room) return;
    if (etat.etat === "direct") {
      if (!confirm("Terminer le live pour tout le monde ?")) return;
      publie({ etat: "fin" }).then(function () {
        clearInterval(minuteur);
        if (verrouEcran) verrouEcran.release().catch(function () {});
        majActions();
        setTimeout(function () { room.localParticipant.setMicrophoneEnabled(false).then(majActions).catch(function () {}); }, 1500);
        arreteEnregistrement().then(finDuLive);
      });
      return;
    }
    (microActif() ? Promise.resolve() : basculeMicro()).then(function () {
      if (!microActif()) return;   /* pas de live sans micro */
      publie({ etat: "direct", slide: String(index) });
      demarreEnregistrement();
      debut = debut || Date.now();
      clearInterval(minuteur);
      minuteur = setInterval(chrono, 1000);
      chrono();
      if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (v) { verrouEcran = v; }).catch(function () {});
      majActions();
      toast("Tu es en direct. Garde cette page ouverte et l'écran allumé.");
    });
  });

  function chrono() {
    var s = Math.floor((Date.now() - debut) / 1000);
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    $("chrono").textContent = (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  /* L'écran se rallume : on reprend le verrou, et on prévient si le micro s'est coupé. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || etat.etat !== "direct") return;
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (v) { verrouEcran = v; }).catch(function () {});
    if (!microActif()) toast("Ton micro est coupé : touche « Micro » pour reprendre.", true);
  });

  $("offre").addEventListener("click", function () { if (room) { publie({ offre: etat.offre === "1" ? "" : "1" }); note({ offre: etat.offre === "1" }); majActions(); } });

  /* ── L'enregistrement pour la rediffusion ──
     Le téléphone enregistre ta voix pendant le live, et note à quel moment
     chaque slide et l'offre apparaissent. Rien ne part tant que tu n'as pas
     touché « Publier la rediffusion » à la fin. */
  function typeAudio() {
    if (!window.MediaRecorder) return null;
    var choix = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm"];
    for (var i = 0; i < choix.length; i++) if (MediaRecorder.isTypeSupported(choix[i])) return choix[i];
    return "";
  }

  function demarreEnregistrement() {
    if (enreg || !room) return;
    var LK = window.LivekitClient;
    var pub = room.localParticipant.getTrackPublication(LK && LK.Track ? LK.Track.Source.Microphone : "microphone");
    var piste = pub && pub.track && pub.track.mediaStreamTrack;
    var type = typeAudio();
    if (!piste || type === null) { toast("Ce navigateur ne peut pas enregistrer la rediffusion. Le live, lui, marche.", true); return; }
    try {
      var rec = new MediaRecorder(new MediaStream([piste]), type ? { mimeType: type, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
      enreg = { recorder: rec, morceaux: [], t0: Date.now(), date: new Date(), type: rec.mimeType || type || "audio/webm",
                evenements: [{ t: 0, slide: index, offre: etat.offre === "1" }] };
      rec.ondataavailable = function (e) { if (e.data && e.data.size) enreg.morceaux.push(e.data); };
      rec.start(5000);
    } catch (e) {
      enreg = null;
      toast("L'enregistrement de la rediffusion n'a pas pu démarrer. Le live, lui, marche.", true);
    }
  }

  function note(evt) {
    if (!enreg) return;
    evt.t = Date.now() - enreg.t0;
    enreg.evenements.push(evt);
  }

  function arreteEnregistrement() {
    return new Promise(function (ok) {
      if (!enreg) { ok(null); return; }
      var e = enreg;
      e.duree = Date.now() - e.t0;
      e.recorder.onstop = function () { ok(e); };
      try { e.recorder.stop(); } catch (x) { ok(e); }
    });
  }

  function minutes(ms) { var m = Math.round(ms / 60000); return m < 1 ? "moins d'une minute" : m + " min"; }

  /* La feuille de fin : publier, télécharger, ou ne rien faire. */
  function finDuLive(e) {
    if (!e || !e.morceaux.length) { toast("Le live est terminé."); return; }
    var base = e.type.split(";")[0];
    var fichier = new Blob(e.morceaux, { type: base });
    var ext = base === "audio/mp4" ? "m4a" : base === "audio/ogg" ? "ogg" : "webm";
    var d = $("menu");
    d.textContent = ""; d.hidden = false;
    var voile = C.el("div", "voile"); voile.style.zIndex = 9;
    var boite = C.el("div", "menu");
    var ap = C.el("div", "apercu", "Ton live est enregistré (" + minutes(e.duree) + ", " + (fichier.size / 1048576).toFixed(1) + " Mo). Publier la rediffusion ? Elle sera rejouée sur ton site, sans consommer de minutes LiveKit.");
    var g = C.el("div", "groupe");
    var publier = C.el("button", null, "Publier la rediffusion"); publier.type = "button";
    var telecharger = C.el("a", null, "Télécharger le fichier");
    telecharger.href = URL.createObjectURL(fichier);
    telecharger.download = "live-" + e.date.toISOString().slice(0, 10) + "." + ext;
    telecharger.style.cssText = "display:grid;place-items:center;min-height:54px;border-top:1px solid var(--hair);color:var(--blue);font-size:17px;text-decoration:none";
    var non = C.el("button", "danger", "Ne pas publier"); non.type = "button";
    g.appendChild(publier); g.appendChild(telecharger); g.appendChild(non);
    var fait = false;
    function ferme() { d.hidden = true; d.textContent = ""; }
    non.addEventListener("click", function () {
      if (fait || confirm("Ne pas publier cette rediffusion ? Tu peux encore télécharger le fichier avant.")) ferme();
    });
    publier.addEventListener("click", function () {
      if (fait) { window.open("/rediffusion", "_blank", "noopener"); return; }
      publier.disabled = true; non.disabled = true;
      envoie(e, fichier, base, ext, function (pc) { publier.textContent = "Envoi… " + pc + " %"; })
        .then(function () {
          fait = true;
          ap.textContent = "La rediffusion est en ligne.";
          publier.textContent = "Voir la rediffusion";
          publier.disabled = false;
          non.textContent = "Fermer"; non.className = ""; non.disabled = false;
        })
        .catch(function (err) {
          ap.textContent = "L'envoi a échoué : " + ((err && err.message) || "erreur inconnue") + ". Réessaie, ou télécharge le fichier pour ne rien perdre.";
          publier.textContent = "Réessayer"; publier.disabled = false; non.disabled = false;
        });
    });
    boite.appendChild(ap); boite.appendChild(g);
    d.appendChild(voile); d.appendChild(boite);
  }

  function envoie(e, fichier, base, ext, progres) {
    var stamp = e.date.toISOString().slice(0, 16).replace(":", "-");
    var options = function (type) {
      return { access: "public", handleUploadUrl: "/api/rediffusion", clientPayload: JSON.stringify({ motDePasse: motDePasse }), contentType: type };
    };
    return import("/live/vendor/blob-client.js").then(function (B) {
      var o = options(base);
      o.multipart = fichier.size > 20 * 1048576;
      o.onUploadProgress = function (p) { progres(Math.round(p.percentage)); };
      return B.upload("rediffusions/" + stamp + "-voix." + ext, fichier, o).then(function (voix) {
        var meta = {
          version: 1, titre: CONF.titre || "Live", date: e.date.toISOString(), duree: e.duree,
          audio: voix.url, type: base, evenements: e.evenements,
          slides: SLIDES, lienOffre: CONF.lienOffre || "", lienChaine: CONF.lienChaine || ""
        };
        var json = new Blob([JSON.stringify(meta)], { type: "application/json" });
        return B.upload("rediffusions/" + stamp + "-live.json", json, options("application/json"));
      });
    });
  }
  $("chat-bascule").addEventListener("click", function () { publie({ chat: etat.chat === "ferme" ? "" : "ferme" }); majActions(); });

  window.addEventListener("beforeunload", function (ev) { if (etat.etat === "direct") { ev.preventDefault(); ev.returnValue = ""; } });

  /* ── La feuille du chat (téléphone) ── */
  function ouvreFeuille(oui) {
    $("feuille").classList.toggle("ouverte", oui);
    $("voile").hidden = !oui;
    if (oui) { nonLus = 0; majActions(); $("liste").scrollTop = $("liste").scrollHeight; }
  }
  $("bouton-chat").addEventListener("click", function () { ouvreFeuille(true); });
  $("fermer-feuille").addEventListener("click", function () { ouvreFeuille(false); });
  $("voile").addEventListener("click", function () { ouvreFeuille(false); });
  var ecranLarge = window.matchMedia("(min-width: 1000px)");

  /* ── Le chat et sa modération ── */
  function ajouteMessage(m) {
    if ($("chat-vide")) $("chat-vide").remove();
    historique.push(m);
    if (historique.length > 40) historique.shift();
    var n = C.rendMessage(m);
    if (!m.anim) n.addEventListener("click", function () { menu(m); });
    C.ajouteEnBas($("liste"), n);
    if (!m.anim && !ecranLarge.matches && !$("feuille").classList.contains("ouverte")) { nonLus++; majActions(); }
  }

  function menu(m) {
    var d = $("menu");
    d.textContent = "";
    d.hidden = false;
    var voile = C.el("div", "voile"); voile.style.zIndex = 9;
    var boite = C.el("div", "menu");
    var ap = C.el("div", "apercu"); ap.appendChild(C.el("b", null, m.nom)); ap.appendChild(document.createTextNode(m.texte));
    var g = C.el("div", "groupe");
    function option(texte, classe, fn) {
      var b = C.el("button", classe, texte); b.type = "button";
      b.addEventListener("click", function () { ferme(); fn(); });
      g.appendChild(b);
    }
    option("Mettre en avant", null, function () { mettreEnAvant(m); });
    option("Masquer ce message", null, function () { masque(m.id); });
    option("Couper son chat", "danger", function () { coupe(m); });
    var annuler = C.el("button", "annuler", "Annuler"); annuler.type = "button";
    function ferme() { d.hidden = true; d.textContent = ""; }
    annuler.addEventListener("click", ferme);
    voile.addEventListener("click", ferme);
    boite.appendChild(ap); boite.appendChild(g); boite.appendChild(annuler);
    d.appendChild(voile); d.appendChild(boite);
  }

  function mettreEnAvant(m) {
    publie({ question: JSON.stringify({ nom: m.nom, texte: m.texte }) });
    $("question").hidden = false;
    $("question-texte").textContent = m.nom + " : " + m.texte;
    ouvreFeuille(false);
    toast("La question s'affiche chez tout le monde.");
  }
  $("retirer-question").addEventListener("click", function () { publie({ question: "" }); $("question").hidden = true; });

  function masque(id) {
    historique = historique.filter(function (x) { return x.id !== id; });
    var n = $("liste").querySelector('[data-id="' + id + '"]');
    if (n) n.remove();
    if (room) room.localParticipant.publishData(C.encode({ id: id }), { reliable: true, topic: "masquer" }).catch(function () {});
  }

  function coupe(m) {
    if (!confirm("Couper le chat de " + m.nom + " ? Ses messages seront masqués.")) return;
    fetch("/api/live", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "chat", motDePasse: motDePasse, identite: m.de, autorise: false }) })
      .then(function (r) { if (!r.ok) throw new Error(); })
      .then(function () {
        historique.filter(function (x) { return x.de === m.de; }).forEach(function (x) { masque(x.id); });
        toast("Son chat est coupé.");
      })
      .catch(function () { toast("Impossible de couper son chat. Masque ses messages à la main.", true); });
  }

  $("form-chat").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var t = C.texteChat($("message").value);
    if (!t || !room) return;
    var m = { id: C.idMessage(), texte: t };
    room.localParticipant.publishData(C.encode(m), { reliable: true, topic: "chat" }).then(function () {
      ajouteMessage({ id: m.id, nom: monNom, texte: t, de: C.ANIMATEUR, anim: true });
      $("message").value = "";
    }).catch(function () { toast("Ton message n'est pas parti.", true); });
  });
})();
</script>
</body>
</html>
